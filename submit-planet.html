<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Submit a Planet</title>

    <link rel="stylesheet" href="style.css">
</head>
<body class="form-page">

    <main class="planet-form-page">

        <a
            class="form-back"
            href="index.html">
            ← Back to Kerbol System
        </a>

        <section class="planet-form-panel">

            <p class="form-eyebrow">
                Future Celestial Body Database
            </p>

            <h1>
                Submit a New Observation
            </h1>

            <p class="form-intro">
                This is a placeholder form.
            </p>

            <form class="planet-form">

                <label>
                    Celestial Body Name

                    <input
                        type="text"
                        name="name"
                        placeholder="Example: Earth"
                        required>
                </label>

                <label>
                    Celestial Body Type

                    <select name="type">
                        <option>Planet</option>
                        <option>Moon</option>
                        <option>Dwarf Planet</option>
                    </select>
                </label>

                <label>
                    Celestial Body Size

                    <input
                        type="number"
                        name="size"
                        placeholder="Example: 60">
                </label>

                <label>
                    Image URL

                    <input
                        type="url"
                        name="image"
                        placeholder="images/planets/earth.png">
                </label>

                <label>
                    Description

                    <textarea
                        name="description"
                        placeholder="Write a short description of the planet..."
                        rows="5"></textarea>
                </label>

                <button
                    class="planet-submit-button"
                    type="button">
                    Submit Planet - Totally Works :-)
                </button>

            </form>

            <audio
                id="form-music"
                src="audio/form.mp3"
                loop>
            </audio>

            <button
                id="music-toggle"
                class="planet-submit-button music-button"
                type="button">
                ♫
            </button>

        </section>

    </main>

<script>
    const formMusic = document.getElementById("form-music");
    const musicToggle = document.getElementById("music-toggle");

    function playFormMusic() {
        formMusic.play()
            .then(() => {
                musicToggle.textContent = "♫";
            })
            .catch(() => {
                // Browser blocked autoplay.
                // The visitor can still use the music button.
                musicToggle.textContent = "♫";
            });
    }

    musicToggle.addEventListener("click", () => {
        if (formMusic.paused) {
            playFormMusic();
        } else {
            formMusic.pause();

            musicToggle.textContent = "♫";
        }
    });

    if (sessionStorage.getItem("play-form-music") === "true") {
        sessionStorage.removeItem("play-form-music");

        playFormMusic();
    }
</script>

</body>
</html>
