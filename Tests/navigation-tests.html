<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kerbol System Tests</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        .pass {
            color: lightgreen;
        }
        .fail {
            color: tomato;
        }
        #test-area {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Kerbol System Tests</h1>
    <div id="results"></div>
    <div id="test-area">

        <div id="star-field"></div>

        <div id="system-view">
            <button id="kerbol"></button>
            <div id="planet-container"></div>
        </div>

        <div id="click-hint"></div>

        <aside id="info-panel">
            <button id="info-close"></button>
            <img id="info-image">
            <h1 id="info-name"></h1>
            <button id="info-prev"></button>
            <button id="info-next"></button>
            <p id="info-type"></p>
            <p id="info-description"></p>
            <div id="info-statistics"></div>
            <span id="ambient-name"></span>
            <audio id="ambient-player"></audio>
        </aside>
        <button id="credits-button"></button>
        <div id="credits-panel">
            <button id="credits-close"></button>
        </div>
    </div>
    <script src="../script.js"></script>
    <!-- Tests -->
    <script>
        const testResults = document.getElementById("results");
        function test(name, condition) {
            const result = document.createElement("p");
            if (condition) {
                result.textContent = "PASS: " + name;
                result.className = "pass";
            } else {
                result.textContent = "FAIL: " + name;
                result.className = "fail";
            }
            testResults.appendChild(result);
        }
        // TEST 1: Planet data exists
        test("Planets array contains planets",planets.length > 0);
        // TEST 2: Every planet has required data
        const planetsHaveData = planets.every(planet =>
                planet.name &&
                planet.type &&
                planet.image &&
                planet.description &&
                planet.stats &&
                planet.audio);
        test("Every planet has required data", planetsHaveData);
        // TEST 3: Moon parent is correct
        let moonParentsCorrect = true;
        planets.forEach(planet => {
            if (!planet.moons) {
                return;
            }
            planet.moons.forEach(moon => {
                if (moon.stats.Parent!== planet.name) {
                    moonParentsCorrect = false;
                }
            });
        });
        test("Every moon has the correct parent",moonParentsCorrect);
        // TEST 4: Next navigation
        currentBodyIndex = 0;
        showNextBody();
        test("Next navigation moves to the next celestial body",currentBodyIndex === 1);
        // TEST 5: Previous navigation
        showPreviousBody();
        test("Previous navigation moves back to the previous celestial body",currentBodyIndex === 0);
        // TEST 6: Previous wraps from first to last
        currentBodyIndex = 0;
        showPreviousBody();
        test("Previous navigation wraps from first to last",currentBodyIndex === celestialBodies.length - 1);
        // TEST 7: Next wraps from last to first
        currentBodyIndex =celestialBodies.length - 1;
        showNextBody();
        test("Next navigation wraps from last to first",currentBodyIndex === 0);
    </script>
</body>
</html>
