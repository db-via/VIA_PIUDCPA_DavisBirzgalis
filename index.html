<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kerbol System</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>
<body>

    <main id="solar-system">
        <!-- Background stars -->
        <div id="star-field"></div>
        <!-- Main horizontal system line -->
        <div id="system-line"></div>
        <!-- Kerbol -->
        <button id="kerbol" type="button">
            <img src="images/planets/Kerbol.png" alt="Kerbol" draggable="false">
        </button>

        <!-- All planets and moons will be generated by script.js -->
        <div id="planet-container"></div>

    <!-- Information panel container that will be used to display information about each planet or moon -->
    <aside
        id="info-panel"
        class="info-panel"
        aria-hidden="true"
        aria-live="polite">

        <!-- Close button for the information panel -->
        <button
            id="info-close"
            class="info-close"
            type="button"
            aria-label="Close information panel">
            ×
        </button>

        <!-- Image container for the information panel -->
        <div class="info-image-container">
            <img
                id="info-image"
                src=""
                alt="">
        </div>

        <!-- Information heading for the information panel -->
        <div class="info-heading">
            <p id="info-type">
                Planet
            </p>

            <h1 id="info-name">
                Kerbin
            </h1>
        </div>

        <p id="info-description">
            Planet description goes here.
        </p>

        <!-- Information statistics for the information panel -->
        <div
            id="info-statistics"
            class="info-statistics">
        </div>

        <!-- Ambient track section for the information panel -->
        <div class="ambient-section">
            <div class="ambient-heading">
                <span class="ambient-icon">
                    ♫
                </span>

                <!-- Ambient track title -->
                <div>
                    <span class="ambient-title">
                        Ambient Track
                    </span>

                    <!-- Ambient track name -->
                    <span id="ambient-name">
                        Kerbin Ambience
                    </span>
                </div>
            </div>

            <!-- Ambient track audio player -->
            <audio
                id="ambient-player"
                controls
                loop
            >
            </audio>

        </div>
        
    </aside>

    </main>

</body>
</html>
